<script type="application/ld+json">
{% if page.layout == 'post' %}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name | default: site.author | default: 'Xi Li' }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "Xi Li",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ "/turing-machine1.png" | absolute_url }}"
    }
  }
}
{% else %}
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "李熙",
  "alternateName": "Xi Li",
  "description": "Associate Professor of Logic at Central South University. Research in Kolmogorov Complexity, Solomonoff Induction, Causal Inference, Rational Decision Theory, and AI Philosophy.",
  "jobTitle": "Associate Professor",
  "worksFor": {
    "@type": "Organization",
    "name": "中南大学",
    "alternateName": "Central South University",
    "url": "https://www.csu.edu.cn/"
  },
  "alumniOf": {
    "@type": "Organization",
    "name": "北京大学",
    "alternateName": "Peking University",
    "url": "https://logic.pku.edu.cn/"
  },
  "url": "{{ site.url }}",
  "image": "{{ "/turing-machine1.png" | absolute_url }}",
  "sameAs": [
    "https://github.com/rickylixi",
    "https://x.com/rickylixi",
    "https://www.zhihu.com/people/pkulixi"
  ],
  "knowsAbout": [
    "Kolmogorov Complexity",
    "Solomonoff Induction", 
    "Universal Reinforcement Learning",
    "Causal Inference",
    "Rational Decision Theory",
    "Philosophy of Artificial Intelligence"
  ],
  "teaches": [
    "Mathematical Logic",
    "Philosophy of Artificial Intelligence"
  ],
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}"
  }
}
{% endif %}
</script>
