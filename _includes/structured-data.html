<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {% if page.layout == 'post' %}
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | escape }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "author": {
    "@type": "Person",
    "name": "Xi Li"
  }
  {% else %}
  "@type": "Person",
  "name": "李熙",
  "alternateName": "Xi Li",
  "description": "Associate Professor of Logic at Central South University. Research in Kolmogorov Complexity, Solomonoff Induction, Causal Inference, and Philosophy of AI.",
  "jobTitle": "Associate Professor",
  "affiliation": {
    "@type": "Organization",
    "name": "Central South University",
    "department": {
      "@type": "Organization",
      "name": "Department of Philosophy"
    }
  },
  "url": "{{ "/" | absolute_url }}",
  "sameAs": [
    "https://github.com/rickylixi",
    "https://x.com/rickylixi",
    "https://www.zhihu.com/people/pkulixi"
  ],
  "knowsAbout": [
    "Logic",
    "Philosophy of Artificial Intelligence",
    "Causal Inference",
    "Game Theory",
    "Kolmogorov Complexity"
  ],
  "worksFor": {
    "@type": "CollegeOrUniversity",
    "name": "Central South University"
  }
  {% endif %}
}
</script>
