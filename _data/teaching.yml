causality_reading_group:
  info:
    - "时间: 每周一次, 长期进行, 节假日除外, 默认周一晚上7:00, 偶尔会根据大家的时间灵活调整"
    - "地点: 中南大学麓南校区二教415"
    - "成员: 不限于我的学生, 欢迎任何对因果感兴趣的朋友加入"
    - "形式: 线下, 成员轮流主讲, 一起讨论"
  topics:
    - "因果图模型/结构因果模型/潜在结果模型"
    - "因果效应识别"
    - "因果反事实推理"
    - "因果中介分析"
    - "因果解释"
    - title: "因果公平"
      link: "https://fairness.causalai.net/"
    - "因果责任"
    - title: "因果激励"
      link: "https://causalincentives.com/"
    - "因果能动性"
    - title: "因果大语言模型"
      link: "https://github.com/zhijing-jin/CausalNLP_Papers"
    - "因果抽象"
    - "因果涌现"
    - "因果表征学习"
    - "因果发现"
    - "因果机制学习"
    - title: "因果强化学习"
      link: "https://crl.causalai.net/"
    - "因果决策"
    - "因果博弈"
    - "事实因果"
    - "回溯因果"
    - "逆向因果"
    - "下向因果"
    - "循环因果"
    - "量子因果"
  books:
    - title: "Judea Pearl: Causality"
      link: "https://bayes.cs.ucla.edu/BOOK-2K/"
      description: "经典参考书"
    - title: "Judea Pearl and Dana Mackenzie: The Book of Why"
      link: "https://bayes.cs.ucla.edu/WHY/"
      description: "科普书，快速入门"
    - title: "Judea Pearl and Madelyn Glymour and Nicholas P. Jewell: Causal Inference in Statistics: A Primer"
      link: "https://bayes.cs.ucla.edu/PRIMER/"
      description: "搭配阅读"
    - title: "Elias Bareinboim: Causal Artificial Intelligence"
      link: "https://causalai-book.net/"
      description: "更新更全的参考书"
  websites:
    - title: "Causal Incentives Working Group"
      link: "https://causalincentives.com/"
    - title: "Online Causal Inference Seminar"
      link: "https://sites.google.com/view/ocis"
    - title: "Elias Bareinboim"
      link: "https://causalai.net"
