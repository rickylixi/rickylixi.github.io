  books:
    intro: "因果方面的书有很多, 推荐以下几本作为参考, 以帮助我们了解因果科学的整体框架、基本概念、模型与方法:"
    list:
      - >
        经典参考书是《因果论》<a href="https://bayes.cs.ucla.edu/BOOK-2K/" target="_blank" rel="noopener noreferrer">Judea Pearl: <em>Causality</em></a>. 这本书写得很\"糙\", 并不易读. 通常来说, 一个领域的经典著作, 其内容结构往往对应着这个领域的体系架构. 而本书却是由作者根据自己的论文和演讲, 稍作裁剪, 拼凑攒成. 写作过程极为偷懒, 既没有照顾学科的知识结构, 也没有照顾读者的阅读体验, 对初学者并不友好.
        然而, 这种\"不负责任\"的写法也有其独特价值. 我们读的虽是书, 享受到的却是读论文的爽感, 关键还是这个领域从无到有的一系列开创性论文. 学到手的不仅是知识, 更重要的是创造的方法. 看着作者如何一点儿一点儿跟传统的概率论统计学范式较劲, 如何跟自己较劲, 如何追根溯源反复回到原点, 把问题拆解到最最底层的哲学层面, 弄清楚\"观察/干预/想象\"或说\"事件/行动/反事实\"的层级(概率如何刻画事件的分布关系并依此进行预测, 行动如何扰动概率分布并给予因果以方向性, 反事实想象如何让信息跨越变与不变的世界之间流淌), 弄清楚全局视角与局部视角的区别(背景条件/外部干预), 事实与自然律的区分, 准决定论与不确定性的关系, 因果预设与经验归纳的关系, 类型与特例的区别, 再从第一性原理出发, 把哲学数学化, 设计合适的语言(因果图, do算子, 结构方程), 建立运算规则, 拓展应用场景…… 
        如果说学习通常的教科书是在欣赏早已完成的艺术品, 那么阅读《因果论》就是在荒原上亲眼目睹拓荒者手搓工具、披荆斩棘、逢山开路、遇水搭桥、测绘选址、夯实地基、搭建脚手架、平地建城的大型直播现场.
      - >
        对基础知识不熟悉又被《因果论》劝退的同学可以通过阅读科普书《为什么》快速入门. <a href="https://bayes.cs.ucla.edu/WHY/" target="_blank" rel="noopener noreferrer">Judea Pearl and Dana Mackenzie: <em>The Book of Why</em>.</a> 
        《为什么》里有理论, 有历史, 有故事, 还有展望. 如果发现哪里不够严谨, 可以搭配短小精悍的《统计因果推理入门》<a href="https://bayes.cs.ucla.edu/PRIMER/" target="_blank" rel="noopener noreferrer">Judea Pearl and Madelyn Glymour and Nicholas P. Jewell: <em>Causal Inference in Statistics: A Primer</em>.</a>
      - >
        更新更全的参考书是 <a href="https://causalai-book.net/" target="_blank" rel="noopener noreferrer">Elias Bareinboim: <em>Causal Artificial Intelligence</em>.</a>

prospective_students:
  title: "Information for Prospective Students"
  content: "我个人偏好以清晰严谨的方式做哲学, 不喜欢空对空的思辨, 也比较排斥华丽的辞藻或晦涩的表达. 为求清晰严谨, 我会借助一些数理工具. 如果想跟我一起做研究, 希望你对数学与逻辑至少抱有开放不排斥的心态."
