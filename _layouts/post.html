---
layout: default
---
<article class="post">
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta"><small>{{ page.date | date: "%B %d, %Y"}}</small> • <small id="page-views">Loading views...</small></p>
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<!-- Giscus Comments - https://giscus.app/ -->
<!-- Giscus Comments - lazy load: a button and intersection observer will load the widget on demand -->
<div id="giscus-wrapper">
  <div id="giscus-container" aria-live="polite"></div>
  <button id="load-giscus" class="load-comments-button" aria-label="加载评论">加载评论</button>
</div>

<script>
  (function(){
    'use strict';
    var loaded = false;
    var loadButton = document.getElementById('load-giscus');
    var container = document.getElementById('giscus-container');

    function injectGiscus() {
      if (loaded || !container) return;
      loaded = true;
      var script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.setAttribute('data-repo', 'rickylixi/rickylixi.github.io');
      script.setAttribute('data-repo-id', 'R_kgDOP6yAsA');
      script.setAttribute('data-category', 'Announcements');
      script.setAttribute('data-category-id', 'DIC_kwDOP6yAsM4CwIgU');
      script.setAttribute('data-mapping', 'title');
      script.setAttribute('data-strict', '1');
      script.setAttribute('data-reactions-enabled', '1');
      script.setAttribute('data-emit-metadata', '1');
      script.setAttribute('data-input-position', 'top');
      script.setAttribute('data-theme', 'preferred_color_scheme');
      script.setAttribute('data-lang', 'zh-CN');
      script.setAttribute('data-loading', 'lazy');
      container.appendChild(script);
      if (loadButton) loadButton.style.display = 'none';
    }

    // Load on button click
    if (loadButton) loadButton.addEventListener('click', injectGiscus, { once: true });

    // Auto-load when container is near viewport
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            injectGiscus();
            io.disconnect();
          }
        });
      }, { rootMargin: '300px' });
      io.observe(container);
    }
  })();
</script>

    // Check if supabase global exists, if not, wait or fail gracefully
    if (typeof supabase !== 'undefined') {
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      // 2. Identify current page
      const pageSlug = window.location.pathname;

      try {
        // 3. Increment usage (Blind fire, don't wait for result to show loading faster? No, we need fresh count)
        await _supabase.rpc('increment_page_view', { page_slug: pageSlug });

        // 4. Fetch updated count
        const { data, error } = await _supabase
          .from('page_views')
          .select('view_count')
          .eq('slug', pageSlug)
          .single();

        if (data) {
          document.getElementById('page-views').innerText = data.view_count + ' views';
        }
      } catch (e) {
        console.error('View counter validation failed', e);
        document.getElementById('page-views').style.display = 'none'; // Hide if failed
      }
    }
  })();
</script>
