---
layout: default
---
<article class="post">
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta"><small>{{ page.date | date: "%B %d, %Y"}}</small> • <small id="page-views" hidden>Loading views...</small></p>
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<!-- Giscus comments (lazy-loaded by button or intersection observer) -->
<div id="giscus-wrapper">
  <div id="giscus-container" aria-live="polite">
    <div class="comments-loading" style="display: none; text-align: center; padding: 2rem;">
      <div class="loading-spinner" style="display: inline-block; width: 24px; height: 24px; border: 3px solid var(--color-border); border-top: 3px solid var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 1rem; color: var(--color-text-light);">正在加载评论...</p>
    </div>
  </div>
  <button id="load-giscus" class="load-comments-button" aria-label="加载评论" aria-expanded="false">
    <span class="button-text">加载评论</span>
    <span class="button-hint" style="display: block; font-size: 0.85rem; opacity: 0.8;">点击或使用 Enter/Space 键</span>
  </button>
</div>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .load-comments-button {
    width: 100%;
    padding: 1rem;
    background: var(--color-surface);
    border: 2px solid var(--color-border);
    border-radius: var(--border-radius, 8px);
    color: var(--color-text);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .load-comments-button:hover,
  .load-comments-button:focus {
    background: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
    outline: none;
  }
  
  .load-comments-button:focus {
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.3);
  }
  
  .load-comments-button:active {
    transform: scale(0.98);
  }
  
  .load-comments-button[aria-expanded="true"] {
    display: none;
  }
</style>

<script>
  (function(){
    'use strict';
    var loaded = false;
    var loadButton = document.getElementById('load-giscus');
    var container = document.getElementById('giscus-container');
    var loadingIndicator = container ? container.querySelector('.comments-loading') : null;

    function showLoading() {
      if (loadingIndicator) loadingIndicator.style.display = 'block';
      if (loadButton) {
        loadButton.disabled = true;
        loadButton.querySelector('.button-text').textContent = '加载中...';
      }
    }

    function hideLoading() {
      if (loadingIndicator) loadingIndicator.style.display = 'none';
      if (loadButton) loadButton.style.display = 'none';
    }

    function injectGiscus() {
      if (loaded || !container) return;
      
      loaded = true;
      showLoading();
      
      // Simulate loading delay for better UX
      setTimeout(function() {
        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.setAttribute('data-repo', 'rickylixi/rickylixi.github.io');
        script.setAttribute('data-repo-id', 'R_kgDOP6yAsA');
        script.setAttribute('data-category', 'Announcements');
        script.setAttribute('data-category-id', 'DIC_kwDOP6yAsM4CwIgU');
        script.setAttribute('data-mapping', 'title');
        script.setAttribute('data-strict', '1');
        script.setAttribute('data-reactions-enabled', '1');
        script.setAttribute('data-emit-metadata', '1');
        script.setAttribute('data-input-position', 'top');
        var siteTheme = document.documentElement.getAttribute('data-theme') || 'light';
        script.setAttribute('data-theme', siteTheme === 'dark' ? 'dark' : 'light');
        script.setAttribute('data-lang', 'zh-CN');
        script.setAttribute('data-loading', 'lazy');
        
        script.onload = function() {
          hideLoading();
        };
        
        script.onerror = function() {
          hideLoading();
          container.innerHTML = '<p style="text-align: center; color: var(--color-text-light); padding: 2rem;">评论加载失败，请稍后重试。</p>';
        };
        
        container.appendChild(script);
      }, 300); // Small delay for spinner visibility
    }

    // Load on button click (with keyboard support)
    if (loadButton) {
      loadButton.addEventListener('click', injectGiscus, { once: true });
      loadButton.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          injectGiscus();
        }
      });
    }

    // Auto-load when container is near viewport
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            injectGiscus();
            io.disconnect();
          }
        });
      }, { rootMargin: '300px' });
      io.observe(container);
    }
  })();
</script>
