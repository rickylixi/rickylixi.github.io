name: Lighthouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

      
    - name: Build site
      run: |
        npm run build
        bundle exec jekyll build

    - name: Serve built site
      run: |
        python3 -m http.server 4000 --directory _site > /tmp/jekyll-static.log 2>&1 &
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:4000/ > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/jekyll-static.log
        exit 1

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://127.0.0.1:4000/
          http://127.0.0.1:4000/research.html
          http://127.0.0.1:4000/teaching.html
          http://127.0.0.1:4000/blog/
        budgetPath: ./.github/lighthouse-budget.json
        uploadArtifacts: false
        temporaryPublicStorage: true
        runs: 3
        
    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse_results
        path: .lighthouseci/
