name: Lighthouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Check dependencies and JavaScript
      run: |
        npm run audit:dependencies
        npm test

    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

      
    - name: Build site
      run: |
        npm run build
        bundle exec jekyll build
        npm run validate:site

    - name: Serve built site
      run: |
        python3 -m http.server 4000 --directory _site > /tmp/jekyll-static.log 2>&1 &
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:4000/ > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/jekyll-static.log
        exit 1

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
      with:
        urls: |
          http://127.0.0.1:4000/
          http://127.0.0.1:4000/research.html
          http://127.0.0.1:4000/teaching.html
          http://127.0.0.1:4000/blog/
        budgetPath: ./.github/lighthouse-budget.json
        uploadArtifacts: false
        temporaryPublicStorage: true
        runs: 3
        
