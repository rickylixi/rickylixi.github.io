name: Generate optimized images

on:
  push:
    branches: [ main ]
    paths:
      - 'image/**'
      - 'scripts/convert-images.js'
      - '.github/workflows/convert-images.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'image/**'
      - 'scripts/convert-images.js'
      - '.github/workflows/convert-images.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  optimize_images:
    name: Convert images and upload artifact
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run image conversion script
        run: |
          node scripts/convert-images.js --src=image --out=image/optimized --formats=webp,avif

      - name: List optimized files
        run: |
          if [ -d image/optimized ]; then ls -l image/optimized || true; else echo "No optimized dir"; fi

      - name: Upload optimized images artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optimized-images
          path: image/optimized

      # NOTE: committing build artifacts from Actions is intentionally
      # disabled to avoid workflow-level secrets usage and accidental
      # repository writes. If you want CI to persist optimized images,
      # consider uploading artifacts or using a dedicated deployment job.
