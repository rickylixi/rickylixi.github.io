---
layout: default
title: "Guestbook"
description: "Leave a message for Xi Li. Read recent notes and greetings from visitors."
sitemap: true
image: "/image/optimized/turing-machine1.avif"
---
<article class="post">
  <div class="post-header">
    <h1 class="post-title">Guestbook</h1>
  </div>

  <div class="post-content">
    <p>Welcome! Feel free to leave a message.</p>

    <!-- Guestbook Form -->
    <form id="gb-form" class="gb-form" novalidate>
        <div class="gb-field">
            <label for="gb-name">Name / Nickname</label>
            <input type="text" id="gb-name" maxlength="50" placeholder="Anonymous" autocomplete="nickname">
        </div>
        <div class="gb-field">
            <label for="gb-message">Message</label>
            <textarea id="gb-message" rows="3" maxlength="500" placeholder="Say something nice..." required></textarea>
            <small class="gb-char-count"><span id="gb-char-count">0</span>/500</small>
        </div>
        <div class="gb-honeypot" aria-hidden="true">
          <label for="gb-website">Website</label>
          <input type="text" id="gb-website" tabindex="-1" autocomplete="off">
        </div>
        <button id="gb-submit" type="submit" class="gb-submit-btn">Sign Guestbook</button>
        <p id="gb-status" class="gb-status" role="status" aria-live="polite" hidden></p>
    </form>

    <!-- Messages List -->
    <h3>Recent Messages</h3>
    <div id="gb-messages">
        <p>Loading messages...</p>
        <noscript>
          <p>The guestbook requires JavaScript to load and post messages.</p>
        </noscript>
    </div>

  </div>
</article>

<!-- Supabase SDK (loaded only on guestbook page; with CDN fallback).
     Version is pinned so an upstream breaking release cannot silently
     break the guestbook. Bump deliberately after testing. -->
<script>
  let _supabase = null;
  const SUPABASE_SDK_VERSION = '2.112.3';
  const SUPABASE_SDK_SOURCES = [
    `https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SUPABASE_SDK_VERSION}`,
    `https://unpkg.com/@supabase/supabase-js@${SUPABASE_SDK_VERSION}`
  ];

  function hasSupabaseClient() {
    return Boolean(window.supabase && typeof window.supabase.createClient === 'function');
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) {
        if (hasSupabaseClient()) {
          resolve();
          return;
        }
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', () => reject(new Error(`Failed to load ${src}`)), { once: true });
        return;
      }

      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.onload = resolve;
      script.onerror = () => reject(new Error(`Failed to load ${src}`));
      document.head.appendChild(script);
    });
  }

  async function ensureSupabaseSdk() {
    if (hasSupabaseClient()) return true;
    for (const src of SUPABASE_SDK_SOURCES) {
      try {
        await loadScript(src);
      } catch (e) {
        // Try next CDN.
      }
      if (hasSupabaseClient()) return true;
    }
    return hasSupabaseClient();
  }

  function resolveSupabaseConfig() {
    let cfg = {};
    const configEl = document.getElementById('supabase-config');
    if (configEl) {
      try {
        cfg = JSON.parse(configEl.textContent || '{}');
      } catch (e) {
        cfg = {};
      }
    }

    const supabaseUrl = cfg.supabaseUrl || window.SUPABASE_URL;
    const supabaseKey = cfg.supabaseAnonKey || window.SUPABASE_KEY;
    if (!supabaseUrl || !supabaseKey) return null;
    if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
    return { supabaseUrl, supabaseKey };
  }

  const messagesContainer = document.getElementById('gb-messages');
  const formEl = document.getElementById('gb-form');
  const submitBtn = document.getElementById('gb-submit');
  const statusEl = document.getElementById('gb-status');
  const messageInput = document.getElementById('gb-message');
  const nameInput = document.getElementById('gb-name');
  const honeypotInput = document.getElementById('gb-website');
  const charCount = document.getElementById('gb-char-count');

  // Rate limiting: 30-second cooldown between posts
  const COOLDOWN_MS = 30000;
  const LAST_POST_KEY = 'guestbook:last-post-time';

  function getLastPostTime() {
    try {
      const value = localStorage.getItem(LAST_POST_KEY);
      return value ? Number(value) : 0;
    } catch (e) {
      return 0;
    }
  }

  function setLastPostTime(timestamp) {
    try {
      localStorage.setItem(LAST_POST_KEY, String(timestamp));
    } catch (e) {
      // Ignore storage errors.
    }
  }

  function showStatus(msg, isError) {
    if (!statusEl) return;
    statusEl.textContent = msg;
    statusEl.className = 'gb-status' + (isError ? ' gb-status-error' : '');
    statusEl.hidden = false;
    setTimeout(() => { statusEl.hidden = true; }, 4000);
  }

  // Load Messages
  async function loadMessages() {
    if (!messagesContainer) return;
    if (!_supabase) {
      messagesContainer.innerHTML = '<p>Guestbook is temporarily unavailable.</p>';
      return;
    }

    let result = null;
    try {
      result = await _supabase
        .from('guestbook_messages')
        .select('name,message,created_at')
        .order('created_at', { ascending: false })
        .limit(20);
    } catch (e) {
      messagesContainer.innerHTML = '<p>Error loading messages.</p>';
      return;
    }
    const { data, error } = result;

    if (error) {
      messagesContainer.innerHTML = '<p>Error loading messages.</p>';
      return;
    }

    if (!data || data.length === 0) {
      messagesContainer.innerHTML = '<p>No messages yet. Be the first!</p>';
      return;
    }

    messagesContainer.innerHTML = data.map((msg) => `
        <div class="gb-message-item">
            <strong>${escapeHtml(msg.name)}</strong>
            <small>${new Date(msg.created_at).toLocaleDateString()}</small>
            <div class="gb-message-text">${escapeHtml(msg.message)}</div>
        </div>
    `).join('');
  }

  function normalizeName(rawName) {
    const name = String(rawName || '').trim();
    if (!name) return 'Anonymous';
    return name.slice(0, 50);
  }

  function isLikelySpam(message) {
    const lower = message.toLowerCase();
    return lower.includes('http://') || lower.includes('https://') || lower.includes('[url]');
  }

  async function submitGuestbookMessage(name, message, honeypot) {
    // Preferred call (new RPC signature)
    let result = await _supabase.rpc('submit_guestbook_message', {
      p_name: name,
      p_message: message,
      p_honeypot: honeypot
    });

    if (!result.error) return result;

    const msg = String(result.error.message || '');
    const missingFn = msg.includes('Could not find the function public.submit_guestbook_message');
    if (!missingFn) return result;

    // Compatibility call (legacy argument names, if backend has older function)
    result = await _supabase.rpc('submit_guestbook_message', {
      name,
      message,
      honeypot
    });
    if (!result.error) return result;

    return result;
  }

  async function handleFormSubmit(event) {
    event.preventDefault();

    if (!_supabase) {
      showStatus('Guestbook is temporarily unavailable.', true);
      return;
    }

    if (honeypotInput.value.trim() !== '') {
      showStatus('Submission blocked.', true);
      return;
    }

    const name = normalizeName(nameInput.value);
    const message = messageInput.value.trim();

    if (!message) {
      showStatus('Please enter a message.', true);
      return;
    }
    if (message.length < 2) {
      showStatus('Message is too short.', true);
      return;
    }
    if (isLikelySpam(message)) {
      showStatus('Links are not allowed in messages.', true);
      return;
    }

    // Rate limiting check
    const now = Date.now();
    const lastPostTime = getLastPostTime();
    if (now - lastPostTime < COOLDOWN_MS) {
      const remaining = Math.ceil((COOLDOWN_MS - (now - lastPostTime)) / 1000);
      showStatus(`Please wait ${remaining}s before posting again.`, true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Posting...';

    let error = null;
    try {
      ({ error } = await submitGuestbookMessage(name, message, honeypotInput.value.trim()));
    } catch (e) {
      error = e;
    }

    if (error) {
      showStatus('Failed to post message: ' + (error.message || 'Unknown error'), true);
    } else {
      setLastPostTime(Date.now());
      messageInput.value = '';
      nameInput.value = '';
      honeypotInput.value = '';
      charCount.textContent = '0';
      showStatus('Message posted successfully!', false);
      await loadMessages();
    }

    submitBtn.disabled = false;
    submitBtn.innerText = 'Sign Guestbook';
  }

  // Utility to prevent XSS
  function escapeHtml(text) {
    if (!text) return text;
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Initialize after layout scripts (including supabase-config) have run.
  document.addEventListener('DOMContentLoaded', async () => {
    const requiredElements = [
      messagesContainer,
      formEl,
      submitBtn,
      statusEl,
      messageInput,
      nameInput,
      honeypotInput,
      charCount
    ];
    if (requiredElements.some((el) => !el)) {
      console.error('Guestbook UI initialization failed: required elements are missing.');
      return;
    }

    messageInput.addEventListener('input', () => {
      charCount.textContent = messageInput.value.length;
    });
    formEl.addEventListener('submit', handleFormSubmit);

    await ensureSupabaseSdk();
    const config = resolveSupabaseConfig();
    if (config) {
      _supabase = supabase.createClient(config.supabaseUrl, config.supabaseKey);
    }
    await loadMessages();
  });
</script>
