title: "李熙 | Xi Li"
description: "Associate Professor of Logic at Central South University. Research in Kolmogorov Complexity, Solomonoff Induction, Causal Inference, Rational Decision Theory, and AI Philosophy."
author: "Xi Li"
twitter:
  username: rickylixi
logo: "/image/optimized/ai-xi.avif"
social:
  name: "Xi Li"
  links:
    - "https://github.com/rickylixi"
    - "https://x.com/rickylixi"
    - "https://www.zhihu.com/people/pkulixi"
baseurl: ""
url: "https://rickylixi.github.io"
permalink: /blog/:year/:month/:day/:title.html
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM
  syntax_highlighter_opts:
    disable: true
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
paginate: 5
paginate_path: "/blog/page:num/"

exclude:
  - "README.md"
  - "teaching/s-beamer.tex"
  - "node_modules"
  - ".github"
  - "package.json"
  - "package-lock.json"
  - "build.js"
  - "_config_sitemap.yml"
  - "Gemfile"
  - "Gemfile.lock"
  - "supabase"

sitemap:
  changefreq: monthly
  priority: 0.8
