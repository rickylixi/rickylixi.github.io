title: "李熙 | Xi Li"
description: "Associate Professor of Logic at Central South University. Research in Kolmogorov Complexity, Solomonoff Induction, Causal Inference, Rational Decision Theory, and AI Philosophy."
author:
  name: "Xi Li"
  twitter: rickylixi
lang: "en"
locale: "en_US"
twitter:
  username: rickylixi
logo: "/image/optimized/ai-xi.avif"
social:
  name: "Xi Li"
  links:
    - "https://github.com/rickylixi"
    - "https://x.com/rickylixi"
    - "https://www.zhihu.com/people/pkulixi"
baseurl: ""
url: "https://rickylixi.github.io"
permalink: /blog/:year/:month/:day/:title.html
markdown: kramdown
kramdown:
  math_engine: null
  input: GFM
  syntax_highlighter_opts:
    disable: true
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-feed
paginate: 5
paginate_path: "/blog/page:num/"

exclude:
  - "README.md"
  - "node_modules"
  - ".github"
  - "package.json"
  - "package-lock.json"
  - "Gemfile"
  - "Gemfile.lock"
  - "supabase"
  # Local tooling that must never be published with the site.
  - "scripts"
  - "build.js"

defaults:
  # Directory-level scopes replace the old 19 per-file PDF entries.
  # research/ contains only PDFs; teaching/ contains PDFs and .tex sources —
  # none belong in the sitemap. Note the trailing slash: it prevents the
  # scope from matching top-level pages like teaching.html / research.html.
  - scope:
      path: "image/leibnizprogram.pdf"
    values:
      sitemap: false
  - scope:
      path: "research/"
    values:
      sitemap: false
  - scope:
      path: "teaching/"
    values:
      sitemap: false
  # Search-engine ownership verification files are not content — keep them
  # out of the sitemap.
  - scope:
      path: "google39aaf1b852e972c8.html"
    values:
      sitemap: false
  - scope:
      path: "yandex_1c34ea3d45b3678b.html"
    values:
      sitemap: false

# NOTE: jekyll-sitemap does not support a `sitemap:` config block or top-level
# `sitemap_priority` front matter. PDF exclusion is handled by the per-file
# defaults above (sitemap: false). To set per-page priority/changefreq, use:
#   sitemap:
#     priority: 0.8
#     changefreq: monthly

# Google Analytics (consumed by _layouts/default.html)
google_analytics: "G-GNJD50R0Z7"
