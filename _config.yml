title: "李熙 | Xi Li"
description: "Associate Professor of Logic at Central South University. Research in Kolmogorov Complexity, Solomonoff Induction, Causal Inference, Rational Decision Theory, and AI Philosophy."
author: "Xi Li"
twitter:
  username: rickylixi
logo: "/image/optimized/ai-xi.avif"
social:
  name: "Xi Li"
  links:
    - "https://github.com/rickylixi"
    - "https://x.com/rickylixi"
    - "https://www.zhihu.com/people/pkulixi"
baseurl: ""
url: "https://rickylixi.github.io"
permalink: /blog/:year/:month/:day/:title.html
markdown: kramdown
kramdown:
  math_engine: null
  input: GFM
  syntax_highlighter_opts:
    disable: true
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
paginate: 5
paginate_path: "/blog/page:num/"

exclude:
  - "README.md"
  - "teaching/s-beamer.tex"
  - "node_modules"
  - ".github"
  - "package.json"
  - "package-lock.json"
  - "build.js"
  - "_config_sitemap.yml"
  - "Gemfile"
  - "Gemfile.lock"
  - "supabase"

sitemap:
  changefreq: monthly
  priority: 0.8
  exclude:
    - "/supabase/"
    - "/node_modules/"
    - "/.github/"
    - "/assets/asset-manifest.json"
    - "/*.pdf"
    - "/*.tex"

# Theme configuration
theme:
  colors:
    primary: "#16a34a"
    primary_hover: "#15803d"
    accent: "#8b5cf6"
  fonts:
    sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    mono: "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
  max_width: "800px"
  border_radius: "8px"

# Google Analytics
google_analytics: "G-GNJD50R0Z7"

# API Configuration
api_timeout: 8000
