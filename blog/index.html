<h1>Xi's Blog</h1>

<ul>
{% for post in paginator.posts %}
  <li><em><a href="{{ post.url }}">{{ post.title }}</a></em> <small>{{ post.date | date: "%Y-%m-%d"}}</small></li>
{% endfor %}
</ul>

<!-- Blog structured data for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "Xi Li's Blog",
  "description": "Academic insights, research notes, and philosophical reflections on mathematics, logic, artificial intelligence, and computational theory",
  "url": "{{ site.url }}/blog/",
  "publisher": {
    "@type": "Person",
    "name": "Xi Li",
    "jobTitle": "Associate Professor of Logic",
    "worksFor": {
      "@type": "Organization",
      "name": "Central South University"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}/blog/"
  }
}
</script>
